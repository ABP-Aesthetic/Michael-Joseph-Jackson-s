<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LocalStorage</title>
</head>

<body>

<h1>LocalStorage</h1>

<pre id="storage"></pre>
<button onclick="localStorage.removeItem('test'); location.reload();">
    Clear test
</button>
    
<script>
    const storage = {};

    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        storage[key] = localStorage.getItem(key);
    }

    document.getElementById("storage").textContent =
        JSON.stringify(storage, null, 2);
</script>

</body>
</html>
