<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonwalkers' Space | Michael Joseph Jackson's</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page-content">

    <h1>💗 Moonwalkers' Space</h1>

    <button id="show-login">Log in</button>
    <button id="show-register">Create an account</button>
    <div id="register-form" style="display: none;">

    <h2>Create your account</h2>
        <p>⚠️ Save your username and password somewhere safe. You can reset your password using your account email, but your username cannot be recovered automatically.</p>

    <input type="text" id="register-username" placeholder="Username">
    <input type="email" id="register-email" placeholder="Email">
    <input type="password" id="register-password" placeholder="Password">

    <button id="register-button">Register</button>

</div>
<div id="login-form" style="display: none;">

    <h2>Log in</h2>

    <input type="email" id="login-email" placeholder="Email">
    <input type="password" id="login-password" placeholder="Password">

    <button id="login-button">Log in</button>

    
    <div id="logged-in-area" style="display: none;">
    <p id="logged-in-message"></p>
    <button id="logout-button">Log out</button>
</div>
    <div id="create-post-area" style="display: none;">
    <button id="create-post-button">✍️ Create a post</button>
</div>
    <div id="create-post-form" style="display: none;">

    <h2>Create a post</h2>

    <textarea id="post-content" placeholder="Write your post..."></textarea>
        <div id="media-upload-area">

    <input
    type="file"
    id="post-media"
    accept="image/*,video/*,audio/*"
    multiple
    style="display: none;"
>

    <div id="drop-zone">
        💾 Upload files or Drag & drop files here
    </div>
            <div id="selected-files"></div>

</div>
<div id="links-area">

    <input
        type="url"
        id="post-link"
        placeholder="Paste a link..."
    >

    <button type="button" id="add-link-button">
        🔗 Add link
    </button>

    <div id="selected-links"></div>

</div>
        
    <button id="publish-post-button">Publish</button>

</div>
    <div id="posts-feed">
    <h2>Latest posts</h2>
    <div id="posts-container"></div>
</div>

</div>

</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    console.log("Supabase conectado:", supabaseClient);
</script>
</body>
</html>
